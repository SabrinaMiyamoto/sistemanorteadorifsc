<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/veiculo.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="shortcut icon" href="./img/logo.ico" type="image/x-icon">
    <title>Cadastro de Veículo</title>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="./img/logo.png" alt="Logo LW"></a>
        </div>
        <button class="menu-toggle" id="mobile-menu">
            <span></span><span></span><span></span>
        </button>
        <nav id="main-nav">
            <a href="index.html#servicos">Serviços</a>
            <a href="index.html#pilares">Pilares</a>
            <a href="cadastro.html" class="btn-clean">Cadastrar</a>
            <a href="veiculo.html">Cadastre seu veículo</a>
            <a href="agendamento.html">Agendar Lavação</a>
        </nav>
    </header>

    <div class="container">        
        <h1>Cadastro de Veículo</h1>
        <p>Insira os dados do veículo para a lavação:</p>
        
        <form action="#" method="POST" id="form">
            <input type="hidden" name="cliente_id" value="1">

            <div class="form-group">
                <label for="marca">Marca do Veículo:</label>
                <input type="text" id="marca" name="marca" placeholder="Ex: Volkswagen..." required>
            </div>

            <div class="form-group">
                <label for="modelo">Modelo do Veículo:</label>
                <input type="text" id="modelo" name="modelo" placeholder="Ex: Gol..." required>
            </div>
            
            <div class="form-group">
                <label for="placa">Número da Placa:</label>
                <input type="text" id="placa" name="placa" maxlength="7" placeholder="ABC1D23" required>
            </div>
            
            <button type="submit">Cadastrar Veículo</button>
        </form>
    </div>

    <div id="modalConfirmacao" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">🚗✨</div>
            <h2 class="modal-title">Cadastro realizado</h2>
            <p class="modal-message">Cadastro realizado com sucesso!<br>Redirecionando para a página de agendamento</p>
            <button class="modal-btn" onclick="fecharModal()">Continuar</button>
        </div>
    </div>

    <script src="./js/veiculo.js"></script>
</body>
</html>
